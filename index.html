    stop(){seq++;done=null;cancelAnimationFrame(raf);try{el.pause();}catch(e){}},
    get el(){return el;}
  };
})();

/* ================= 記住進度與設定 ================= */
const KEY='beyond-the-tide.reader.v3';   // 正文改版，舊的閱讀進度對不上，換一個新的存檔
const Store={
  load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}},
  save(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
};
const saved=Store.load();
const S={ si:0, li:-1, done:new Set(saved.done||[]), tog:{},
  voice:saved.voice||null,
  dir:saved.dir==='h'?'h':'v', fs:['s','m','l'].includes(saved.fs)?saved.fs:'m', hints:saved.hints!==false,
  auto:false, narr:false, ended:false };
function persist(){Store.save({si:S.si,li:S.li,done:[...S.done],dir:S.dir,fs:S.fs,hints:S.hints,voice:S.voice});}

/* ================= 畫面 ================= */
const $=id=>document.getElementById(id);
const artEl=$('art'),flow=$('flow'),pageEl=$('page');
const NS='http://www.w3.org/2000/svg';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
let curBd=null,curSvg=null,autoTimer=null,playTimer=null;

function fmt(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/[0-9A-Za-z][0-9A-Za-z.\-]*[0-9A-Za-z]|[0-9A-Za-z]/g,m=>`<span class="${m.length<=3&&!/[.\-]/.test(m)?'tcy':'up'}">${m}</span>`)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function classOf(s){const t=s.replace(/\*/g,'');
  if(/^19\d\d[.\-]\d/.test(t))return 'line date';
  return 'line';}

/* ---- 文字頁：一句一句往下（直排往左）排，排滿就翻頁 ---- */
function overflows(el){const a=flow.getBoundingClientRect(),b=el.getBoundingClientRect();
  return S.dir==='v' ? b.left<a.left-1 : b.bottom>a.bottom+1;}
function addEl(el,instant){
  flow.appendChild(el);
  if(flow.children.length>1 && overflows(el)){
    flow.replaceChildren(el);
    if(!instant){flow.classList.remove('turn');void flow.offsetWidth;flow.classList.add('turn');AudioEng.page();}
  }
  /* 小螢幕上，長句子自己一頁還放不下時，把那一句的字縮小一點 */
  let f=1;while(overflows(el)&&f>.6){f-=.05;el.style.fontSize=f.toFixed(2)+'em';}
}
function addLine(text,cls,instant){
  [...flow.children].forEach(c=>{c.classList.add('old');c.classList.remove('in');});
  const p=document.createElement('p');p.className=(cls||'line')+(instant?'':' in');p.innerHTML=fmt(text);
  addEl(p,instant);return p;
}
function addHeading(si,instant){
  const s=SCENES[si],h=document.createElement('h2');
  h.className='chap'+(/^第.卷/.test(s.t)&&/\d/.test(s.t)?' vol':'');
  h.innerHTML=fmt(s.t)+(s.pt>1&&s.p>1?`<small>之${CN[s.p]||s.p}</small>`:'');
  flow.replaceChildren(h);
  if(!instant){flow.classList.remove('turn');void flow.offsetWidth;flow.classList.add('turn');}
}

/* ---- 場景 ---- */
function buildSpots(svg,bd){
  const g=document.createElementNS(NS,'g');g.setAttribute('class','spots z');g.dataset.z='.55';
  (PROBE[bd]||[]).forEach(o=>{
    const [x,y,w,h]=o.at,key=bd+':'+o.id;
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx',3);
    r.setAttribute('class','spot'+(S.done.has(key)?' used':''));r.setAttribute('tabindex','0');r.setAttribute('role','button');
    r.setAttribute('aria-label','看看這裡');r.dataset.at=o.at.join(',');if(o.need)r.dataset.need=o.need;
    const d=document.createElementNS(NS,'circle');d.setAttribute('cx',x+w/2);d.setAttribute('cy',y+h/2);d.setAttribute('r',2.4);
    d.setAttribute('class','dot');
    const act=e=>{e.stopPropagation();touch(bd,o,r);};
    r.addEventListener('click',act);
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(e);}});
    const part=svg.querySelector(`[data-part="${o.id}"]`);
    if(part){r.classList.add('haspart');
      r.addEventListener('pointerenter',()=>part.classList.add('hot'));
      r.addEventListener('pointerleave',()=>part.classList.remove('hot'));}
    g.append(r,d);
  });
  svg.appendChild(g);
}
function touch(bd,o,r){
  const key=bd+':'+o.id,t=TOGGLE[key];
  const part=curSvg.querySelector(`[data-part="${o.id}"]`);
  if(part){part.classList.remove('hit');void part.getBoundingClientRect();part.classList.add('hit');}
  if(t && S.done.has(key)){
    S.tog[bd]=!S.tog[bd];curSvg.classList.toggle('open',S.tog[bd]);
    addLine(S.tog[bd]?t.on:t.off,'line probe');AudioEng.blip('ok');AudioEng.window(S.tog[bd]);
  }else{
    const arr=Array.isArray(o.say)?o.say:[o.say];
    addLine(arr[Math.min(arr.length-1,Math.floor(S.si/SCENES.length*arr.length))],'line probe');
    S.done.add(key);r.classList.add('used');AudioEng.blip('probe');
  }
  persist();stopAuto();
}
function setArt(bd){
  if(bd===curBd){syncScene();return;}
  curBd=bd;document.body.dataset.bd=bd;
  [...artEl.querySelectorAll('.layer')].forEach(c=>{c.classList.remove('on');
    setTimeout(()=>{if(!c.classList.contains('on'))c.remove();},1700);});
  const d=document.createElement('div');d.className='layer';d.innerHTML=(ART[bd]||ART.room)();
  artEl.insertBefore(d,$('atmos'));
  curSvg=d.querySelector('svg');buildSpots(curSvg,bd);
  curSvg.classList.toggle('open',!!S.tog[bd]);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));
  AudioEng.scene(bd);AudioEng.window(!!S.tog[bd]);Atmos.scene(bd);syncScene();
}
/* ---- 場景狀態：由「讀到哪裡」推算出來，所以跳章節、重新整理都會是對的 ---- */
const G=(si,li)=>OFFSET[si]+li+1;
const MECH_AT={};MECH.forEach(m=>MECH_AT[m.at.join('.')]=m);
const TIMELINE=[...MECH.map(m=>({g:G(...m.at),set:Object.assign({},...m.steps.map(x=>x.set||{}))})),
  ...EVENTS.map(e=>({g:G(...e.at),set:e.set}))].sort((a,b)=>a.g-b.g);
function stateNow(){
  const g=pos(),st={};
  TIMELINE.forEach(e=>{if(e.g<=g)Object.assign(st,e.set);});
  if(Mech.cur)Mech.cur.steps.slice(0,Mech.i).forEach(x=>Object.assign(st,x.set||{}));
  return st;
}
function syncScene(){
  if(!curSvg)return;const st=stateNow(),cl=curSvg.classList;
  cl.toggle('hints',S.hints);
  [...cl].forEach(c=>{if(c.startsWith('st-'))cl.remove(c);});
  Object.entries(st).forEach(([k,v])=>{if(v){cl.add('st-'+k);cl.add('st-'+k+v);}});
  cl.toggle('busy',!!Mech.cur);
  curSvg.querySelectorAll('.m-cas .tlabel').forEach(t=>t.textContent=st.loaded?`1993.8.${10+st.loaded}`:'');
  curSvg.querySelectorAll('.m-loose .tlabel').forEach(t=>t.textContent=st.held?`1993.8.${10+st.held}`:'');
  curSvg.querySelectorAll('.cas').forEach(c=>{const k=+c.dataset.i+1;c.classList.toggle('in',st.loaded===k||st.held===k);});
  curSvg.querySelectorAll('.spot').forEach(r=>{const n=r.dataset.need,hide=n&&(n[0]==='!'?!!st[n.slice(1)]:!st[n]);
    r.style.display=hide?'none':'';if(r.nextSibling)r.nextSibling.style.display=hide?'none':'';});
}

/* ---- 機關 ---- */
const Mech={cur:null,i:0,done:null,timer:0,off:null,last:0,
  start(m,done){this.cur=m;this.i=0;this.done=done;
    const p=addLine(m.say,'line gate');p.dataset.gate='1';$('idle').classList.add('on');this.arm();},
  arm(){this.disarm();syncScene();
    const st=this.cur.steps[this.i],el=curSvg&&curSvg.querySelector(st.tap||st.drag);
    if(!el){this.advance();return;}
    const tgt=st.to?curSvg.querySelector(st.to):null;
    el.classList.add('cue');if(st.drag)el.classList.add('drag');if(tgt)tgt.classList.add('on');
    const ok=()=>this.act(el,st);
    const un=st.tap?onTap(el,ok):onDrag(el,st,tgt,ok);
    this.off=()=>{un();el.classList.remove('cue','drag','held');if(tgt)tgt.classList.remove('on');};
    this.kick(true);},
  disarm(){if(this.off){this.off();this.off=null;}clearTimeout(this.timer);},
  /* 讀者做完了這一步 */
  act(el,st){this.disarm();
    if(st.fx){el.classList.remove(st.fx);void el.getBoundingClientRect();el.classList.add(st.fx);setTimeout(()=>el.classList.remove(st.fx),900);}
    if(st.snd==='clunk')AudioEng.clunk();else if(st.snd==='page')AudioEng.page();else if(st.snd)AudioEng.blip('ok');
    setTimeout(()=>{if(this.cur)this.advance();},st.delay||0);},
  advance(){this.i++;if(this.i<this.cur.steps.length){this.arm();return;}this.finish();},
  /* 做完（或時間到、或讀者直接點文字頁）：把剩下的步驟一次做完，往下讀 */
  finish(){if(!this.cur)return;this.disarm();const d=this.done;this.clear();d();},
  clear(){this.disarm();this.cur=null;this.done=null;$('idle').classList.remove('on');
    flow.querySelectorAll('[data-gate]').forEach(x=>x.remove());if(curSvg)curSvg.classList.remove('busy');},
  /* 螢幕上有任何動作，就重新倒數 */
  kick(force){if(!this.cur)return;const now=performance.now();if(!force&&now-this.last<160)return;this.last=now;
    clearTimeout(this.timer);const bar=$('idle').firstChild;
    bar.style.transition='none';bar.style.transform='scaleX(1)';void bar.offsetWidth;
    bar.style.transition=`transform ${IDLE_MS}ms linear`;bar.style.transform='scaleX(0)';
    this.timer=setTimeout(()=>{if(anySheet()){this.kick(true);return;}this.finish();},IDLE_MS);}
};
['pointerdown','pointermove','keydown'].forEach(ev=>document.addEventListener(ev,()=>Mech.kick(),true));

function onTap(el,fn){const h=e=>{e.stopPropagation();e.preventDefault();fn();};
  el.addEventListener('click',h);return()=>el.removeEventListener('click',h);}
/* 拖：元素跟著手指走；放開時如果到了目標（或拖得夠遠）就算完成，否則彈回原位 */
function onDrag(el,st,tgt,fn){
  const home=el.getAttribute('transform')||'';let held=false,p0=null,d=[0,0];
  const pt=e=>{const p=curSvg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(el.parentNode.getScreenCTM().inverse());};
  const far=()=>(st.dy<0&&d[1]<=st.dy)||(st.dy>0&&d[1]>=st.dy)||(st.dx&&Math.abs(d[0])>=st.dx);
  const hit=()=>{if(!tgt)return far();const a=el.getBoundingClientRect(),b=tgt.getBoundingClientRect(),
    cx=a.left+a.width/2,cy=a.top+a.height/2,m=18;return cx>b.left-m&&cx<b.right+m&&cy>b.top-m&&cy<b.bottom+m;};
  const reset=()=>{if(home)el.setAttribute('transform',home);else el.removeAttribute('transform');el.style.transform='';};
  const down=e=>{e.stopPropagation();e.preventDefault();held=true;p0=pt(e);d=[0,0];el.classList.add('held');
    try{el.setPointerCapture(e.pointerId);}catch(x){}stopAuto();};
  const move=e=>{if(!held)return;const p=pt(e);d=[p.x-p0.x,p.y-p0.y];
    if(st.lock==='y')d=[0,Math.min(0,d[1])];
    if(st.swing){el.style.transform=`scaleX(${Math.max(.09,1-Math.abs(d[0])/st.dx*.5).toFixed(3)})`;return;}
    el.setAttribute('transform',`translate(${d[0].toFixed(1)} ${d[1].toFixed(1)}) ${home}`);};
  const up=()=>{if(!held)return;held=false;el.classList.remove('held');const ok=hit();reset();if(ok)fn();};
  const click=e=>e.stopPropagation();
  el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('click',click);
  return()=>{reset();el.removeEventListener('pointerdown',down);el.removeEventListener('pointermove',move);
    el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.removeEventListener('click',click);};
}

/* ---- 空氣與鏡頭 ---- */
const Atmos=(()=>{
  const cv=$('atmos'),c=cv.getContext('2d');let W=0,H=0,dpr=1,cfg=null,P=[],vb=150,raf=0;
  const cam={x:0,y:0,tx:0,ty:0,last:0};
  function size(){const r=artEl.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);
    W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  function map(x,y){const s=Math.max(W/400,H/440);return[(W-400*s)/2+x*s,(H-440*s)/2+(y-vb)*s,s];}
  function seed(){P=[];if(!cfg)return;
    for(let i=0;i<cfg.n;i++){const b=cfg.box||[0,0,0,0];
      P.push({x:b[0]+Math.random()*b[2],y:b[1]+Math.random()*b[3],r:Math.random(),ph:Math.random()*6.28,
        sp:.4+Math.random()*.8,a:Math.random()*6.28,rad:6+Math.random()*24});}}
  function draw(t){c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);if(!cfg)return;
    const ox=cam.x*7,oy=cam.y*4;
    P.forEach(p=>{let x=p.x,y=p.y,rad,al;
      if(cfg.k==='moth'){p.a+=.012*p.sp*(1+Math.sin(t*.0011+p.ph));
        x=cfg.at[0]+Math.cos(p.a*1.7+p.ph)*p.rad;y=cfg.at[1]+Math.sin(p.a*2.3)*p.rad*.7;rad=.8;al=.55+.35*Math.sin(t*.01+p.ph);}
      else if(cfg.k==='rain'){p.y+=7*p.sp;p.x-=1.2*p.sp;const b=cfg.box;if(p.y>b[1]+b[3]){p.y=b[1];p.x=b[0]+Math.random()*b[2];}
        const [qx,qy,qs]=map(p.x,p.y);c.strokeStyle=`rgba(${cfg.c},${(.1+.22*p.r).toFixed(2)})`;c.lineWidth=Math.max(.6,.9*qs);
        c.beginPath();c.moveTo(qx+ox,qy+oy);c.lineTo(qx+ox-2*qs,qy+oy+12*qs);c.stroke();return;}
      else if(cfg.k==='bokeh'){p.x+=Math.sin(t*.0002+p.ph)*.02;rad=7+p.r*13;al=.05+.05*Math.sin(t*.0007*p.sp+p.ph)+.03;}
      else{p.y-=.018*p.sp;p.x+=Math.sin(t*.0005*p.sp+p.ph)*.03;const b=cfg.box;
        if(p.y<b[1]){p.y=b[1]+b[3];p.x=b[0]+Math.random()*b[2];}
        rad=(.5+p.r*.9)*(cfg.s||1);al=(.12+.38*p.r)*(.55+.45*Math.sin(t*.0012*p.sp+p.ph));}
      const [px,py,s]=map(x,y),R=Math.max(.6,rad*s);
      if(cfg.k==='bokeh'){const g=c.createRadialGradient(px+ox,py+oy,0,px+ox,py+oy,R);
        g.addColorStop(0,`rgba(${cfg.c},${al})`);g.addColorStop(1,`rgba(${cfg.c},0)`);c.fillStyle=g;}
      else c.fillStyle=`rgba(${cfg.c},${Math.max(0,al)})`;
      c.beginPath();c.arc(px+ox,py+oy,R,0,6.283);c.fill();});}
  function camera(t){
    if(t-cam.last>3500){cam.tx=Math.sin(t*.00021)*.42;cam.ty=Math.cos(t*.00017)*.3;}
    cam.x+=(cam.tx-cam.x)*.04;cam.y+=(cam.ty-cam.y)*.04;
    artEl.querySelectorAll('.layer.on .z').forEach(g=>{const k=+g.dataset.z;
      g.style.transform=`translate(${(cam.x*k*9).toFixed(2)}px,${(cam.y*k*5).toFixed(2)}px)`;});}
  function loop(t){draw(t);camera(t);raf=requestAnimationFrame(loop);}
  artEl.addEventListener('pointermove',e=>{const r=artEl.getBoundingClientRect();
    cam.tx=((e.clientX-r.left)/r.width-.5)*-2;cam.ty=((e.clientY-r.top)/r.height-.5)*-2;cam.last=performance.now();});
  addEventListener('resize',()=>{size();if(reduced)draw(0);});
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);
    if(!document.hidden&&!reduced)raf=requestAnimationFrame(loop);});
  return{scene(bd){cfg=ATMOS[bd]||null;vb=VB[bd]||150;size();seed();if(reduced)draw(0);},
    start(){size();if(!reduced){cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}}};
})();

/* ---- 進度：一捲帶子，左邊愈讀愈少，右邊愈繞愈多 ---- */
function pos(){return OFFSET[S.si]+S.li+1;}
function updateBar(){
  const g=pos(),f=g/TOTAL;
  $('rL').setAttribute('r',(3.5+4.5*(1-f)).toFixed(2));$('rR').setAttribute('r',(3.5+4.5*f).toFixed(2));
  $('ttl').textContent=SCENES[S.si].t;
  $('cnt').textContent=`${g}／${TOTAL} 句`;
}
function spin(){ $('deck').classList.add('play');clearTimeout(playTimer);
  if(!S.auto)playTimer=setTimeout(()=>$('deck').classList.remove('play'),1300); }

/* ---- 往下讀 ---- */
function enterScene(instant){
  const s=SCENES[S.si];
  setArt(s.bd);
  if(S.narr)Narr.prep(S.si);
  if(S.si===0||SCENES[S.si-1].t!==s.t||instant)addHeading(S.si,instant);
}
function step(){
  if(S.ended)return;
  if(Mech.cur){Mech.finish();return;}          // 機關進行中點文字頁：直接往下
  const s=SCENES[S.si];
  if(S.li>=s.l.length-1){
    if(S.si>=SCENES.length-1){S.ended=true;stopAuto();$('mark').classList.remove('on');
      addLine('目前收錄到這裡。','line end');return;}
    S.si++;S.li=-1;enterScene(false);
  }
  const m=MECH_AT[S.si+'.'+(S.li+1)];
  if(m){clearTimeout(autoTimer);Mech.start(m,reveal);return;}
  reveal();
}
function reveal(){
  S.li++;const t=SCENES[S.si].l[S.li];
  addLine(t,classOf(t));updateBar();spin();persist();syncScene();
  speak(t);
}
/* 念出剛出現的那一句：先找音檔，沒有就用裝置語音；都沒有而且開著「自動」，就照字數等一下再往下 */
function speak(t){
  let spoken=false;
  if(S.narr){
    const later=()=>{if(S.auto&&!anySheet()){clearTimeout(autoTimer);autoTimer=setTimeout(step,420);}};
    const viaVoice=()=>{if(!Voice.say(t,later)&&S.auto)queueAuto(t.length);};
    spoken=Narr.say(S.si,S.li,()=>{if(S.auto&&!anySheet())step();},viaVoice)||Voice.say(t,later);
  }
  if(S.auto&&!spoken)queueAuto(t.length);
}
/* 跳到某個位置（續讀、目錄、改排版後重排）：把這一場已讀的句子一次排好 */
function jump(si,li){
  Mech.clear();Narr.stop();
  S.si=Math.max(0,Math.min(SCENES.length-1,si));S.ended=false;
  const n=SCENES[S.si].l.length;S.li=Math.max(-1,Math.min(n-1,li));
  flow.replaceChildren();enterScene(true);
  for(let i=0;i<=S.li;i++){const t=SCENES[S.si].l[i];addLine(t,classOf(t),true);}
  updateBar();
  if(S.li<0){S.li=-1;step();}else{persist();syncScene();}
  $('mark').classList.add('on');
}
function queueAuto(len){clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>{if(S.auto&&!anySheet())step();},Math.min(7500,1300+len*105));}
function setAuto(v){S.auto=v;$('bAuto').setAttribute('aria-pressed',v);clearTimeout(autoTimer);
  $('deck').classList.toggle('play',v);if(v)queueAuto(8);}
function stopAuto(){if(S.auto)setAuto(false);}
const anySheet=()=>!!document.querySelector('.sheet.on')||$('start').classList.contains('on');

/* ---- 目錄、設定、回顧 ---- */
function seg(id,cur,fn){[...$(id).children].forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===String(cur));
  b.onclick=()=>{fn(b.dataset.v);};});}
function applySettings(relayout){
  document.body.classList.toggle('hz',S.dir==='h');document.body.dataset.fs=S.fs;
  seg('segDir',S.dir,v=>{S.dir=v;applySettings(true);});
  seg('segFs',S.fs,v=>{S.fs=v;applySettings(true);});
  seg('segHint',S.hints?1:0,v=>{S.hints=v==='1';applySettings(false);});
  syncScene();persist();
  if(relayout&&curBd)jump(S.si,S.li);
}
function openMenu(){stopAuto();Voice.stop();Narr.stop();const box=$('chapList'),cur=chapOf(S.si);box.replaceChildren();
  CHAPS.forEach((ch,k)=>{const b=document.createElement('button');
    b.className='chapitem'+(k===cur?' cur':(k>cur?' unread':''));
    b.innerHTML=`<span class="n">${k+1}</span><span>${ch.t.replace(/</g,'&lt;')}</span><span class="c">${ch.n} 句</span>`;
    b.onclick=()=>{$('menu').classList.remove('on');jump(ch.first,-1);};box.appendChild(b);});
  $('menu').classList.add('on');
  const c=box.querySelector('.cur');if(c)c.scrollIntoView({block:'center'});}
function openLog(){stopAuto();Voice.stop();Narr.stop();const box=$('logList');box.replaceChildren();
  const end=pos(),from=Math.max(0,end-90);let n=0,last=null;
  SCENES.forEach(s=>s.l.forEach(t=>{n++;if(n<=from||n>end)return;
    if(s.t!==last){last=s.t;const h=document.createElement('h4');h.textContent=s.t;box.appendChild(h);}
    const p=document.createElement('p');if(/^「/.test(t))p.className='q';
    p.innerHTML=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');box.appendChild(p);}));
  $('log').classList.add('on');box.scrollTop=box.scrollHeight;}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.sheet').classList.remove('on'));

/* ---- 操作 ---- */
pageEl.addEventListener('click',()=>{step();});
$('deck').onclick=openMenu;
$('bMenu').onclick=openMenu;
$('bLog').onclick=openLog;
$('bAuto').onclick=()=>setAuto(!S.auto);
function fillVoices(){const sel=$('selVoice'),vs=Voice.list();sel.replaceChildren();
  vs.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+'（'+v.lang+'）';sel.appendChild(o);});
  sel.value=Voice.current;sel.hidden=!vs.length;
  $('voiceNote').textContent=!Voice.ok?'這個瀏覽器沒有內建語音；有旁白音檔的段落仍然會念。':(vs.length?'沒有旁白音檔的段落會用這個聲音念。聲音來自這台裝置，換瀏覽器或裝置會有不同的選擇。':'這台裝置沒有中文語音；有旁白音檔的段落仍然會念。');}
if(S.voice)Voice.choose(S.voice);
Voice.onlist(fillVoices);fillVoices();
$('selVoice').onchange=e=>{S.voice=e.target.value;Voice.choose(S.voice);persist();
  const was=Voice.on;Voice.set(true);Voice.say('你發現那封信的時候，是四月的最後一個星期。',()=>{if(!was)Voice.set(false);});};
$('bVoice').onclick=()=>{S.narr=!S.narr;Voice.set(S.narr);$('bVoice').setAttribute('aria-pressed',S.narr);
  if(S.narr){Narr.unlock();Narr.prep(S.si);if(S.li>=0&&!Mech.cur)speak(SCENES[S.si].l[S.li]);}
  else{Narr.stop();Voice.stop();}};
$('bSound').onclick=()=>{let v=false;try{v=AudioEng.set(!AudioEng.on);}catch(e){}
  $('bSound').setAttribute('aria-pressed',v);};
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('.spot'))return;
  if($('start').classList.contains('on')){if(e.key==='Enter'||e.key===' '){e.preventDefault();begin(false);}return;}
  if(e.key==='Escape'){document.querySelectorAll('.sheet.on').forEach(s=>s.classList.remove('on'));return;}
  if(anySheet())return;
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if([' ','Enter','ArrowLeft','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();step();}
  if(e.key==='a'||e.key==='A')setAuto(!S.auto);
  if(e.key==='m'||e.key==='M')openMenu();
});
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(curBd&&!$('start').classList.contains('on'))jump(S.si,S.li);},200);});

/* ---- 開場 ---- */
const hasProgress=Number.isInteger(saved.si)&&(saved.si>0||saved.li>0)&&saved.si<SCENES.length;
$('startBack').innerHTML=ART.corridor();
$('ver').textContent=VERSION;
if(hasProgress){$('bStart').textContent='接著讀';$('bRestart').hidden=false;}
function begin(fresh){
  $('start').classList.remove('on');
  if(fresh){S.done.clear();}
  try{AudioEng.set(true);$('bSound').setAttribute('aria-pressed',true);}catch(e){}
  Atmos.start();
  if(hasProgress&&!fresh)jump(saved.si,saved.li);else jump(0,-1);
}
$('bStart').onclick=()=>begin(false);
$('bRestart').onclick=()=>begin(true);
applySettings(false);
</script>
</body>
</html>
